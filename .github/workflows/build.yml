name: Build PS2 ELF

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas
        run: apk add --no-cache build-base git sed

      - name: Parche temporal - permitir fio/fileXio directo
        # El ps2sdk actual prohíbe incluir fileio.h/fileXio.h salvo que
        # se defina NEWLIB_PORT_AWARE. Se agrega a los flags de Makefile.ps2.
        run: |
          sed -i 's/-DSOUND_ON/-DSOUND_ON -DNEWLIB_PORT_AWARE/' Makefile.ps2
          grep -n "NEWLIB_PORT_AWARE" Makefile.ps2
          # browser.c: el tipo se llama io_dirent_t en el SDK actual y faltaba stdlib.h
          sed -i 's/fio_dirent_t/io_dirent_t/g' src/drivers/ps2/browser.c
          sed -i '1i #include <stdlib.h>' src/drivers/ps2/browser.c

      - name: Compilar
        # El target exacto depende de Makefile.ps2; ajustar cuando lo veamos
        # -k sigue compilando los otros archivos aunque uno falle,
        # así un solo log muestra todos los errores pendientes
        run: make -k -f Makefile.ps2 clean all

      - name: Subir ELF
        uses: actions/upload-artifact@v4
        with:
          name: emulador-ps2
          path: "*.elf"
          if-no-files-found: error
